[package]
name = "eullm-agent"
version = "0.7.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "EULLM Agent — autonomous ReAct agent with multi-provider LLM support"

[[bin]]
name = "eullm-agent"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP — rustls-tls: pure Rust TLS, no system OpenSSL required on any platform
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.0.0"

# Telegram bot — rustls: pure Rust TLS, mirrors reqwest above
teloxide = { version = "0.12", default-features = false, features = ["macros", "rustls", "auto-send", "ctrlc_handler"] }

# Error handling
anyhow = "1"

# Async trait
async-trait = "0.1"

# Core service: HTTP API, PostgreSQL state, token hashing, ids
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "matched-path"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "sqlite-bundled", "macros", "migrate", "json", "uuid"] }
sha2 = "0.11.0"
base64 = "0.23.1"
getrandom = "0.4.3"
uuid = { version = "1.27.0", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Process groups and O_NOFOLLOW for the sandboxed tools
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
