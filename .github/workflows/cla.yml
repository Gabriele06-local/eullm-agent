name: CLA

# Fails every pull request whose description lacks the CLA agreement line.
# Reads only the event payload: no checkout, no third-party actions, read-only
# token, so it is safe on pull requests from forks.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions: {}

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    steps:
      - name: Check the CLA line in the pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSOC: ${{ github.event.pull_request.author_association }}
        run: |
          # The copyright holder's own people do not sign the CLA. A private
          # organisation membership shows up as CONTRIBUTOR in the event, so
          # the copyright holder's accounts are also listed by name.
          case " primoco " in *" ${PR_AUTHOR} "*)
            echo "@${PR_AUTHOR} is the copyright holder: no CLA needed."
            exit 0;;
          esac
          # Dependabot only changes dependency versions and lock files.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependency update by Dependabot: no CLA needed."
            exit 0
          fi
          if [ "$PR_ASSOC" = "OWNER" ] || [ "$PR_ASSOC" = "MEMBER" ]; then
            echo "@${PR_AUTHOR} is ${PR_ASSOC} of the organisation: no CLA needed."
            exit 0
          fi
          echo "@${PR_AUTHOR} is ${PR_ASSOC}: the CLA line is required."
          required='I have read and agree to the Contributor Licence Agreement in CLA.md.'
          # The sentence may sit anywhere in the description, even inside a
          # paragraph or wrapped across lines: whitespace is collapsed first.
          if printf '%s\n' "$PR_BODY" | tr '\r\n\t' '   ' | tr -s ' ' \
              | grep -Fq -- "$required"; then
            echo "CLA agreed by @${PR_AUTHOR}."
            exit 0
          fi
          echo "::error title=CLA missing::Add this line to the pull request description, then save it to re-run the check: $required"
          echo "See CLA.md for what it grants and why it is needed."
          exit 1
