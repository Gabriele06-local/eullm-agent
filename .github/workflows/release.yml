name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: eullm-agent-linux-x64
            # The server image is made from this binary: no second compile.
            image: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: eullm-agent-linux-arm64
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: eullm-agent-macos-arm64
          # macOS Intel x64 disabled: macos-13 runners have very low availability
          # and queue for 15-30+ min. Re-enable when runner availability improves.
          # - os: macos-13
          #   target: x86_64-apple-darwin
          #   binary: eullm-agent-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: eullm-agent-windows-x64.exe

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # A tag cannot read another tag's cache, only main's: CI saves this one
      # on main (job release-cache), so a release starts with the
      # dependencies already compiled.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        if: '!matrix.use_cross'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/eullm-agent ${{ matrix.binary }}
          sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\eullm-agent.exe" "${{ matrix.binary }}"
          $hash = (Get-FileHash "${{ matrix.binary }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.binary }}" | Out-File -Encoding ascii "${{ matrix.binary }}.sha256"

      - name: Image context
        if: matrix.image
        run: |
          mkdir image
          cp ${{ matrix.binary }} image/eullm-agent
          strip image/eullm-agent
          cp Dockerfile.release image/Dockerfile

      - uses: docker/setup-buildx-action@v4
        if: matrix.image

      - uses: docker/login-action@v4
        if: matrix.image
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: matrix.image
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/eullm-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        if: matrix.image
        with:
          context: image
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.binary }}.sha256

      - name: Notify Telegram on build failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Release build failed</b>%0APlatform: <code>${{ matrix.target }}</code>%0ATag: <code>${{ github.ref_name }}</code>%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Images for the server installation (deploy/server), pulled instead of
  # compiled on the server. Linux x86-64 only. The Core one is made by the
  # linux x64 build job.
  images:
    name: image-${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Core image is pushed by the linux x64 build above.
          - name: eullm-agent-editor
            context: editor-mode
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v3
        id: gh_release
        with:
          files: artifacts/**
          fail_on_unmatched_files: false
          generate_release_notes: true

      - name: Notify Telegram on release published
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="✅ <b>Release published</b>: <code>${{ github.ref_name }}</code>%0A${{ steps.gh_release.outputs.url }}"

      - name: Notify Telegram on release failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Release job failed</b> for tag <code>${{ github.ref_name }}</code>%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
