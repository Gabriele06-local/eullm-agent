name: CI

on:
  # Every push, on any branch: a branch is checked before its pull request
  # is opened, so it is green by the time it is merged.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch replaces the run still going.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A pull request from a branch of this repository was already checked by
    # its push; only pull requests from forks need their own run. main only
    # receives merges of branches already checked: it is not checked again.
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eullm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/eullm_test
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: bubblewrap sandbox
        # The sandbox tests run programs through bwrap. Ubuntu runners
        # restrict unprivileged user namespaces through AppArmor.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test
        run: cargo test --locked

      - name: Notify Telegram on failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured, skipping notification"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="&#10060; <b>CI failed</b> on <code>${{ github.ref_name }}</code>%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # The release build of main, kept in the cache the tag's release reads:
  # a tag cannot read another tag's cache, only main's.
  release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-unknown-linux-gnu
      - run: cargo build --locked --release --target x86_64-unknown-linux-gnu

  editor-mode:
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EDITOR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: editor-mode
    steps:
      - uses: actions/checkout@v7

      - name: uv
        run: pipx install uv==0.13.0

      - name: test
        # Failed tests also become annotations, readable without the raw log.
        run: |
          set -o pipefail
          uv run --locked pytest -rfE | tee pytest.out || {
            grep -E '^(FAILED|ERROR) ' pytest.out | sed 's/^/::error title=pytest::/'
            exit 1
          }
