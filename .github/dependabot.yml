# Dependabot opens pull requests for new dependency versions; CI tests them
# like any other change and nothing is merged automatically. Minor and patch
# updates arrive together once a week; a major version comes on its own, to
# be read against its changelog before merging.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /editor-mode
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
