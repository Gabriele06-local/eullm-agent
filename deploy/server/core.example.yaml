# Core configuration for deploy/server. Copy to core.yaml; secrets stay in .env.

# The model. EuLLM Engine on this machine:
provider:
  type: eullm
  base_url: http://host.docker.internal:11434
  model: default
# Or an OpenAI-compatible service (Groq, OpenRouter, ...):
# provider:
#   type: openai
#   base_url: https://api.groq.com/openai/v1
#   model: openai/gpt-oss-120b
#   api_key_env: LLM_API_KEY
# Or NVIDIA Build (free for trials, a reasoning model):
# provider:
#   type: openai
#   base_url: https://integrate.api.nvidia.com/v1
#   model: nvidia/nemotron-3.5-super-vl-120b-a12b
#   api_key_env: LLM_API_KEY
#   max_tokens: 16384   # the reasoning counts too: without it the answer can be empty

# A spare model, used when the one above fails (an error, a rate limit, a
# timeout). Free tiers change often: check the provider's limits. Mistral is
# European; its free tier may use prompts for training unless you opt out.
# fallback: spare
# models:
#   spare:
#     provider:
#       type: openai
#       base_url: https://api.mistral.ai/v1
#       model: mistral-small-latest
#       api_key_env: LLM_FALLBACK_API_KEY
#     pricing: {input_per_mtok: 0.0, output_per_mtok: 0.0}
#     # A spare can have its own spare, e.g. OpenRouter's free models:
#     # fallback: spare2
#   spare2:
#     provider:
#       type: openai
#       base_url: https://openrouter.ai/api/v1
#       model: openrouter/free
#       api_key_env: LLM_FALLBACK2_API_KEY
#     pricing: {input_per_mtok: 0.0, output_per_mtok: 0.0}

workspace: /var/lib/eullm-agent/workspace

database:
  url_env: DATABASE_URL

api:
  listen: 0.0.0.0:8088
  tokens:
    - name: editor-mode
      tenant: editor
      token_env: EDITOR_CORE_TOKEN
      # Each Editor Mode tenant is a Core tenant of its own (editor/<tenant>),
      # with the limits of its plan (`editor tenant-plan`). These apply to a
      # tenant whose plan sets none: no customer is unlimited by omission.
      delegate: true
      delegate_limits: {max_cost_per_month: 5.0, max_fetches_per_day: 10000}
    - name: admin
      tenant: default
      token_env: CORE_ADMIN_TOKEN
  fetch: {}            # Editor Mode reads the web through the Core
  # tenants:           # limits per tenant, see config.example.yaml
  #   editor: {max_cost_per_month: 50.0, max_fetches_per_day: 20000}
